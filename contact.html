<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Khairul Azmi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">Khairul Azmi</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="contact-section">
        <div class="contact-container">
            <h1>Get In Touch</h1>
            <p>I'd love to hear from you! Whether you have questions, collaboration opportunities, or just want to say hello, feel free to reach out.</p>

            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>

            <div style="margin-top: 3rem; text-align: center; color: #666;">
                <p style="margin-bottom: 1rem;">Or connect with me on:</p>
                <p>
                    <a href="#" style="color: #3498db; text-decoration: none; margin: 0 1rem;">GitHub</a>
                    <a href="#" style="color: #3498db; text-decoration: none; margin: 0 1rem;">LinkedIn</a>
                    <a href="#" style="color: #3498db; text-decoration: none; margin: 0 1rem;">Twitter</a>
                </p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Khairul Azmi. All rights reserved.</p>
            <div class="theme-toggle">
                <button id="theme-btn" class="theme-btn">🌙 Dark Mode</button>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
